name: Sync Bilibili Animation Data
run-name: Sync Bilibili animation rankings

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-data:
    name: Update anime and donghua rankings
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Bilibili anime and donghua rankings
        uses: ./.github/actions/run-with-retry
        with:
          description: Bilibili anime and donghua rankings
          command: node scripts/bilibili_animation.js

      - name: Validate data/bilibili_animation_data.json
        run: node scripts/validate-generated-data.js data/bilibili_animation_data.json

      - name: Commit changed Bilibili animation data
        uses: ./.github/actions/commit-generated-data
        with:
          file: data/bilibili_animation_data.json
          message: "chore: update Bilibili animation data [skip ci]"
