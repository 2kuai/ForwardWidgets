name: Update Douban TV Data
run-name: Update Douban TV and variety lists

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-data:
    name: Update TV, animation, documentary, and variety lists
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Generate Douban TV and variety lists
        uses: ./.github/actions/run-with-retry
        with:
          description: Douban TV, animation, documentary, and variety lists
          command: python scripts/update-dbtv-data.py

      - name: Validate data/dbtv-data.json
        run: python scripts/validate-generated-data.py data/dbtv-data.json

      - name: Commit changed Douban TV data
        uses: ./.github/actions/commit-generated-data
        with:
          file: data/dbtv-data.json
          message: "chore: update Douban TV data [skip ci]"
