name: Update Douban Movie Data
run-name: Update Douban movie regional lists

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-data:
    name: Update all, Chinese, Western, Korean, and Japanese movie lists
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Generate Douban movie regional lists
        uses: ./.github/actions/run-with-retry
        with:
          description: Douban movie regional lists
          command: python scripts/update-dbmovie-data.py

      - name: Validate data/dbmovie-data.json
        run: python scripts/validate-generated-data.py data/dbmovie-data.json

      - name: Commit changed Douban movie regional data
        uses: ./.github/actions/commit-generated-data
        with:
          file: data/dbmovie-data.json
          message: "chore: update Douban movie regional data [skip ci]"
