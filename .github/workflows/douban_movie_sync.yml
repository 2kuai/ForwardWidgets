name: Sync Douban Movie Data
run-name: Sync Douban movie lists

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-data:
    name: Update now playing, coming soon, and Top 250 movies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      DOUBAN_API_KEY: ${{ secrets.DOUBAN_API_KEY }}
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Douban movie lists
        uses: ./.github/actions/run-with-retry
        with:
          description: Douban now playing, coming soon, and Top 250 movie lists
          command: node scripts/douban_movie.js

      - name: Validate data/douban_movie_data.json
        run: node scripts/validate-generated-data.js data/douban_movie_data.json

      - name: Commit changed Douban movie data
        uses: ./.github/actions/commit-generated-data
        with:
          file: data/douban_movie_data.json
          message: "chore: update Douban movie data [skip ci]"
