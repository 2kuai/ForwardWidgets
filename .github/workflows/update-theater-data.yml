name: Update Theater Collection Data
run-name: Update Douban theater collections

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-data:
    name: Update Mist, White Night, and X theater collections
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Douban theater collections
        uses: ./.github/actions/run-with-retry
        with:
          description: Mist, White Night, and X theater collections
          command: node scripts/update-theater-data.js

      - name: Validate data/theater-data.json
        run: node scripts/validate-generated-data.js data/theater-data.json

      - name: Commit changed theater collection data
        uses: ./.github/actions/commit-generated-data
        with:
          file: data/theater-data.json
          message: "chore: update theater collection data [skip ci]"
